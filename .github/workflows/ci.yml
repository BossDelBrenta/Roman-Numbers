name: Roman Number CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout del repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup JDK 11
      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # Step 3: Compilazione del progetto
      - name: Compilazione
        run: mvn compile

      # Step 4: Esecuzione dei test
      - name: Test
        run: mvn test

      # Step 5: Analisi statica con Checkstyle (fase package)
      - name: Checkstyle
        run: mvn package

      # Step 6: Generazione report coverage
      - name: Coverage report
        run: mvn jacoco:report

      # Step 7: Pubblicazione coverage su Coveralls
      - name: Coveralls
        run: >
          mvn coveralls:report
          -DrepoToken=${{ secrets.COVERALLS_REPO_TOKEN }}
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
